<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catfish Tim Tattoos - Custom &amp; Traditional Tattooing</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="antialiased">

  <!-- MAIN WRAPPER (Max-width 1200px constraint) -->
  <div class="max-w-[1200px] mx-auto px-4 sm:px-6 lg:px-8">

    <!-- 1. NAVIGATION COMPONENT -->
    <div id="navbar-placeholder"></div>

    <main>
      <!-- 2. HERO SECTION -->
      <section class="py-16 md:py-24 text-center border-b retro-divider">
        <span class="block text-base md:text-lg font-handwriting text-espresso-muted mb-8">
          Handmade Tattoos by
        </span>

        <h1 class="font-retro-display text-[clamp(3.75rem,14vw,10.5rem)] uppercase mb-12">
          Catfish Tim
        </h1>

        <div class="flex flex-col items-center gap-5">
          <a href="booknow.html" class="btn-retro-primary w-full sm:w-auto text-sm md:text-base px-8 py-4">
            Book Now
          </a>
          <a href="#gallery" class="retro-nav-link inline-flex items-center gap-2 text-xs">
            Work <span>↓</span>
          </a>
        </div>
      </section>

      <!-- SUB-NAVIGATION / CATEGORY BAR -->
      <section class="py-6 border-b retro-divider overflow-x-auto" aria-label="Tattoo categories">
        <div class="flex justify-start md:justify-center items-center gap-6 sm:gap-10 font-retro-mono text-xs sm:text-sm font-bold uppercase tracking-widest whitespace-nowrap min-w-max px-2">
          <span class="text-espresso cursor-default">Custom</span>
          <span class="text-terracotta">✦</span>
          <span class="text-espresso cursor-default">American Traditional</span>
          <span class="text-terracotta">✦</span>
          <span class="text-espresso cursor-default">Cartoons</span>
          <span class="text-terracotta">✦</span>
          <span class="text-espresso cursor-default">Black and Gray</span>
        </div>
      </section>

      <!-- 3. GALLERY SECTION (GRID / CAROUSEL TOGGLE) -->
      <section id="gallery" class="py-12 md:py-16 border-b retro-divider">
        <div class="flex flex-col sm:flex-row items-center justify-between gap-4 mb-8">
          <h2 class="font-retro-mono text-xs uppercase tracking-widest text-espresso-muted font-bold">
            Selected Flash &amp; Custom Work
          </h2>

          <!-- Grid / Carousel View Switcher -->
          <div class="view-toggle-group" role="group" aria-label="Gallery view toggle">
            <button id="btn-grid-view" type="button" class="view-toggle-btn active">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/>
              </svg>
              Grid
            </button>
            <button id="btn-carousel-view" type="button" class="view-toggle-btn">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 7h16M4 17h16M7 7v10m10-10v10"/>
              </svg>
              Carousel
            </button>
          </div>
        </div>

        <!-- Gallery Track (Switches between 3x7 Grid & Horizontal Carousel) -->
        <div id="gallery-track" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 md:gap-8">
          
          <!-- Slot 1 -->
          <div class="tattoo-card aspect-square overflow-hidden group">
            <img src="pics/albatross.PNG" alt="albatross" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" loading="lazy">
          </div>
          <!-- Slot 2 -->
          <div class="tattoo-card aspect-square overflow-hidden group">
            <img src="pics/avohombre.PNG" alt="avohombre" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" loading="lazy">
          </div>
          <!-- Slot 3 -->
          <div class="tattoo-card aspect-square overflow-hidden group">
            <img src="pics/banquet.PNG" alt="banquet" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" loading="lazy">
          </div>
          <!-- Slot 4 -->
          <div class="tattoo-card aspect-square overflow-hidden group">
            <img src="pics/beerskeletoncowboy.PNG" alt="beerskeletoncowboy" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" loading="lazy">
          </div>
          <!-- Slot 5 -->
          <div class="tattoo-card aspect-square overflow-hidden group">
            <img src="pics/bomberbunny.PNG" alt="bomberbunny" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" loading="lazy">
          </div>
          <!-- Slot 6 -->
          <div class="tattoo-card aspect-square overflow-hidden group">
            <img src="pics/bombergirl.PNG" alt="bombergirl" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" loading="lazy">
          </div>
          <!-- Slot 7 -->
          <div class="tattoo-card aspect-square overflow-hidden group">
            <img src="pics/boobs.PNG" alt="boobs" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" loading="lazy">
          </div>
          <!-- Slot 8 -->
          <div class="tattoo-card aspect-square overflow-hidden group">
            <img src="pics/calvinandhobbes.PNG" alt="calvinandhobbes" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" loading="lazy">
          </div>
          <!-- Slot 9 -->
          <div class="tattoo-card aspect-square overflow-hidden group">
            <img src="pics/canpipe.PNG" alt="canpipe" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" loading="lazy">
          </div>
          <!-- Slot 10 -->
          <div class="tattoo-card aspect-square overflow-hidden group">
            <img src="pics/cowboy.PNG" alt="cowboy" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" loading="lazy">
          </div>
          <!-- Slot 11 -->
          <div class="tattoo-card aspect-square overflow-hidden group">
            <img src="pics/cowboykermit.PNG" alt="cowboykermit" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" loading="lazy">
          </div>
          <!-- Slot 12 -->
          <div class="tattoo-card aspect-square overflow-hidden group">
            <img src="pics/cowboyskull.PNG" alt="cowboyskull" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" loading="lazy">
          </div>
          <!-- Slot 13 -->
          <div class="tattoo-card aspect-square overflow-hidden group">
            <img src="pics/fry.PNG" alt="fry" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" loading="lazy">
          </div>
          <!-- Slot 14 -->
          <div class="tattoo-card aspect-square overflow-hidden group">
            <img src="pics/itchy.PNG" alt="itchy" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" loading="lazy">
          </div>
          <!-- Slot 15 -->
          <div class="tattoo-card aspect-square overflow-hidden group">
            <img src="pics/melonpus.PNG" alt="melonpus" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" loading="lazy">
          </div>
          <!-- Slot 16 -->
          <div class="tattoo-card aspect-square overflow-hidden group">
            <img src="pics/pbrsmash.PNG" alt="pbrsmash" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" loading="lazy">
          </div>
          <!-- Slot 17 -->
          <div class="tattoo-card aspect-square overflow-hidden group">
            <img src="pics/r2d2.PNG" alt="r2d2" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" loading="lazy">
          </div>
          <!-- Slot 18 -->
          <div class="tattoo-card aspect-square overflow-hidden group">
            <img src="pics/skeletoncowboy.PNG" alt="skeletoncowboy" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" loading="lazy">
          </div>
          <!-- Slot 19 -->
          <div class="tattoo-card aspect-square overflow-hidden group">
            <img src="pics/stormtrooper.PNG" alt="stormtrooper" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" loading="lazy">
          </div>
          <!-- Slot 20 -->
          <div class="tattoo-card aspect-square overflow-hidden group">
            <img src="pics/tradwolf.PNG" alt="tradwolf" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" loading="lazy">
          </div>

          <!-- Slot 21 (Retro Booking CTA Card) -->
          <a href="booknow.html" class="tattoo-cta-card aspect-square p-8 flex flex-col items-center justify-center text-center group">
            <h3 class="font-retro-serif text-3xl sm:text-4xl leading-tight mb-3">
              Your Idea Next
            </h3>
            <p class="text-sm opacity-90 mb-6 max-w-[220px]">
              Got a custom piece or flash idea in mind? Let's get it on skin.
            </p>
            <span class="font-retro-mono text-xs font-bold uppercase tracking-wider underline underline-offset-4">
              Book Appointment →
            </span>
          </a>

        </div>

        <!-- Carousel Prev / Next Controls (Visible only in Carousel Mode) -->
        <div id="carousel-controls" class="hidden flex items-center justify-center gap-4 mt-4">
          <button id="carousel-prev" type="button" class="carousel-nav-btn" aria-label="Previous tattoo">
            ←
          </button>
          <span class="font-retro-mono text-xs uppercase tracking-widest text-espresso-muted">
            Swipe or Use Arrows
          </span>
          <button id="carousel-next" type="button" class="carousel-nav-btn" aria-label="Next tattoo">
            →
          </button>
        </div>
      </section>
    </main>

    <!-- FOOTER COMPONENT -->
    <div id="footer-placeholder"></div>

  </div>

  <!-- LIGHTBOX MODAL -->
  <div id="lightbox" class="lightbox-backdrop fixed inset-0 z-50 hidden items-center justify-center p-4 sm:p-6" role="dialog" aria-modal="true" aria-label="Tattoo image preview">
    <div class="lightbox-frame relative max-w-2xl w-full p-4 sm:p-6 flex flex-col items-center">
      <!-- Top Bar: Counter & Close -->
      <div class="w-full flex items-center justify-between mb-3">
        <span id="lightbox-counter" class="font-retro-mono text-xs font-bold uppercase tracking-widest text-espresso-muted">
          1 / 20
        </span>
        <button id="lightbox-close" type="button" class="font-retro-mono text-xs font-bold uppercase tracking-wider px-3 py-1.5 border-2 border-[#231A16] rounded hover:bg-[#C85A32] hover:text-[#F4EFE6] transition-colors">
          Close [ESC]
        </button>
      </div>

      <!-- Image Container -->
      <div class="w-full aspect-square max-h-[65vh] bg-[#EFE8DC] border-2 border-[#231A16] rounded-lg overflow-hidden flex items-center justify-center">
        <img id="lightbox-img" src="" alt="" class="w-full h-full object-contain">
      </div>

      <!-- Bottom Bar: Title, Prev/Next & Book CTA -->
      <div class="w-full flex flex-wrap items-center justify-between gap-4 mt-4">
        <div class="flex items-center gap-2">
          <button id="lightbox-prev" type="button" class="carousel-nav-btn" aria-label="Previous image">←</button>
          <button id="lightbox-next" type="button" class="carousel-nav-btn" aria-label="Next image">→</button>
          <span id="lightbox-title" class="font-retro-mono text-xs sm:text-sm font-bold uppercase tracking-wider ml-2 text-espresso">
            ALBATROSS
          </span>
        </div>

        <a href="booknow.html" class="btn-retro-primary px-4 py-2 text-xs">
          Book Similar
        </a>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
